<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adhkār & Duʿāʾs</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background: #f3fdf3;
      color: #2d4739;
    }
    header {
      background-color: #17804e;
      color: white;
      padding: 20px;
      text-align: center;
    }
    main {
      padding: 20px;
    }
    .search-box {
      margin: 20px auto;
      max-width: 600px;
      display: flex;
    }
    .search-box input {
      flex: 1;
      padding: 10px;
      border: 2px solid #17804e;
      border-radius: 8px;
      font-size: 16px;
    }
    .section {
      margin-top: 30px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 12px;
      background-color: #fff;
    }
    .dua {
      margin: 10px 0;
      padding: 10px;
      background: #e8f7eb;
      border-radius: 10px;
    }
    .dua p {
      margin: 5px 0;
    }
    .ar {
      font-size: 20px;
      text-align: right;
      direction: rtl;
      color: #0a3f26;
    }
    .fr {
      font-size: 16px;
      text-align: left;
      color: #333;
    }
  </style>
</head>
<body>

  <header>
    <h1>Adhkār & Douʿāʾs</h1>
    <p>Rappels quotidiens pour les musulmans</p>
  </header>

  <main>
    <div class="search-box">
      <input type="text" id="search" placeholder="Rechercher un adhkār ou un duʿāʾ..." onkeyup="searchDua()" />
    </div>

    <div class="section" id="duas">
      <div class="dua">
        <p class="ar">اللّهُـمَّ أَنْتَ رَبِّـي لا إلهَ إلاّ أَنْتَ</p>
        <p class="fr">Ô Allah, Tu es mon Seigneur, nul autre que Toi ne mérite l'adoration.</p>
      </div>
      <div class="dua">
        <p class="ar">أَسْتَغْفِرُ اللّٰهَ</p>
        <p class="fr">Je demande pardon à Allah.</p>
      </div>
      <div class="dua">
        <p class="ar">سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ</p>
        <p class="fr">Gloire et louange à Allah.</p>
      </div>
    </div>
  </main>

  <script>
    function searchDua() {
      const input = document.getElementById("search").value.toLowerCase();
      const duas = document.querySelectorAll(".dua");
      duas.forEach((dua) => {
        const text = dua.innerText.toLowerCase();
        dua.style.display = text.includes(input) ? "block" : "none";
      });
    }
  </script>

</body>
</html>
